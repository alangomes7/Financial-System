spring:
  application:
    name: financial-backend
  config:
    # Load the root `.env` file (KEY=value format) for local development.
    # Real environment variables always take precedence over these values.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_db}
    username: ${DB_USERNAME:finance_user}
    # No default on purpose: the password must come from the environment.
    password: ${DB_PASSWORD}
    hikari:
      pool-name: financial-hikari
      maximum-pool-size: 10
      connection-timeout: 10000
  jackson:
    time-zone: America/Sao_Paulo

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO

